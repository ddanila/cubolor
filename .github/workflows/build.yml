name: DOS build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y dosbox-x
      - name: Build and test
        run: make test
      - name: Package
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: cubolor-dos
          path: dist/
